name: Security Audit and CI

on:
  push:
    branches: [main, Assignment3]
  pull_request:
    branches: [main, Assignment3]

jobs:
  security-audit:
    name: [X1] Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Assignment3/package-lock.json

      - name: Run dependency audit (High and Critical severity)
        working-directory: Assignment3
        run: npm run audit

  test-and-lint:
    name: Lint, Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Assignment3/package-lock.json

      - name: Install dependencies
        working-directory: Assignment3
        run: npm ci

      - name: Run linter
        working-directory: Assignment3
        run: npm run lint

      - name: Build project
        working-directory: Assignment3
        run: npm run build
