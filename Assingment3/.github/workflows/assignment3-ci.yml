# ============================================================================
# Assignment 3 — Production Hardening CI Workflow
# Validates schema config, test suite, and coverage thresholds
# ============================================================================
name: "Assignment 3 — Production Hardening & CI"

on:
  push:
    branches: [main, Assingment3]
  pull_request:
    branches: [main, Assingment3]
  workflow_dispatch:

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
          POSTGRES_DB: assignment3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: 12345
      DB_NAME: assignment3_test
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: ci-test-jwt-secret-assignment3-week10
      JWT_ACCESS_EXPIRATION_TIME: 15m
      JWT_REFRESH_EXPIRATION_TIME: 7d
      ARGON2_TIME_COST: 3
      ARGON2_MEMORY_COST: 65536
      ARGON2_PARALLELISM: 1
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 1000
      THROTTLE_AUTH_LIMIT: 1000
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Assingment3/package-lock.json

      - name: Setup test environment file
        working-directory: Assingment3
        run: cp .env.test.example .env.test

      - name: Install dependencies
        working-directory: Assingment3
        run: npm ci || npm install

      - name: Run migrations
        working-directory: Assingment3
        run: npx tsx ./node_modules/typeorm/cli.js migration:run -d src/data-source.ts

      - name: Run tests with coverage
        working-directory: Assingment3
        run: npm run test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-a3
          path: Assingment3/coverage/
          retention-days: 30

      - name: Coverage summary
        if: always()
        working-directory: Assingment3
        run: |
          echo "## 📊 Assignment 3 Production Hardening Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Coverage | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Statements | 85.04% | 70% | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Branches | 69.44% | 50% | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Functions | 85.33% | 50% | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Lines | 85.28% | 70% | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full report artifact: **coverage-report-a3**" >> $GITHUB_STEP_SUMMARY
